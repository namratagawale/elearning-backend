<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Learning Platform - Admin Management Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">⚙️ Admin Control Panel</div>
        <nav class="nav-links">
            <a href="index.html">← Back to Student Portal</a>
        </nav>
    </header>

    <main class="container">
        
        <!-- Add Course & Quiz Form -->
        <section class="dashboard-section" style="margin-bottom: 30px;">
            <h2>Add New Course & Multiple Quizzes</h2>
            <form id="addCourseForm" onsubmit="handleAddCourse(event)" class="stats-card">
                <div class="form-group">
                    <label>Course Title</label>
                    <input type="text" id="adminTitle" required placeholder="e.g. Advanced Spring Boot">
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="adminCategory" style="width:100%; padding:8px; border-radius:6px; border:1px solid #cbd5e1;">
                        <option value="Technology">Technology</option>
                        <option value="Science">Science & Math</option>
                        <option value="Commerce">Commerce</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <input type="text" id="adminDesc" required placeholder="Short course description">
                </div>
                <div class="form-group">
                    <label>Instructor Name</label>
                    <input type="text" id="adminInstructor" required placeholder="Instructor name">
                </div>
                <div class="form-group">
                    <label>Video URL</label>
                    <input type="text" id="adminVideo" required placeholder="https://www.video.com/gallery/...">
                </div>
                
                <hr style="margin: 15px 0; border:0; border-top:1px solid #cbd5e1;">
                
                <h4>MCQ Quizzes Setup</h4>
                <div id="quizListContainer">
                    <!-- Dynamic multiple questions will be injected here via admin.js -->
                </div>
                
                <button type="button" onclick="addQuizQuestionField()" style="background: #3b82f6; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-bottom: 20px;">+ Add Another Question</button>
                
                <br>
                <button type="submit" class="btn-primary" style="background:#10b981;">Add Course to Catalog</button>
            </form>
        </section>

        <!-- Manage Courses -->
        <section class="dashboard-section" style="margin-bottom: 30px;">
            <h2>Manage Existing Courses</h2>
            <div style="overflow-x: auto; margin-top: 15px;">
                <table style="width:100%; border-collapse: collapse; text-align: left;">
                    <thead>
                        <tr style="border-bottom: 2px solid #cbd5e1; background: #f1f5f9;">
                            <th style="padding: 10px;">Title</th>
                            <th style="padding: 10px;">Category</th>
                            <th style="padding: 10px;">Instructor</th>
                            <th style="padding: 10px;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="adminCourseTableBody"></tbody>
                </table>
            </div>
        </section>

        <!-- Student Progress Tracker -->
        <section class="dashboard-section">
            <h2>👥 Enrolled Students & Progress Monitoring</h2>
            <div style="overflow-x: auto; margin-top: 15px;">
                <table style="width:100%; border-collapse: collapse; text-align: left;">
                    <thead>
                        <tr style="border-bottom: 2px solid #cbd5e1; background: #f1f5f9;">
                            <th style="padding: 10px;">Student Name</th>
                            <th style="padding: 10px;">Email</th>
                            <th style="padding: 10px;">Completed Courses Count</th>
                        </tr>
                    </thead>
                    <tbody id="adminStudentTableBody"></tbody>
                </table>
            </div>
        </section>

    </main>
    
    <script src="admin.js"></script>
</body>
</html>
